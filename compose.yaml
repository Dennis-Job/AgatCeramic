name: agatceramic

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    working_dir: /var/www/backend
    command: >-
      sh -c "install-locked-dependencies composer /var/www/backend
      && exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./backend:/var/www/backend
      - ./docs:/var/www/docs:ro
      - backend_vendor:/var/www/backend/vendor
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    working_dir: /var/www/backend
    command: >-
      sh -c "install-locked-dependencies composer /var/www/backend
      && exec php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue-integration:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    profiles: ["queue-integration"]
    working_dir: /var/www/backend
    command: >-
      sh -c "install-locked-dependencies composer /var/www/backend
      && exec sh scripts/run-redis-queue-integration.sh"
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      CI: "true"
      DB_CONNECTION: pgsql
      DB_HOST: queue-test-postgres
      DB_PORT: "5432"
      DB_DATABASE: agatceramic_queue_test
      DB_USERNAME: agatceramic_queue_test
      DB_PASSWORD: queue-test-only-password
      DB_SSLMODE: prefer
      DB_URL: ""
      CACHE_STORE: array
      MAIL_MAILER: array
      MAIL_FROM_ADDRESS: queue-worker@example.test
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: queue-test-redis
      REDIS_PORT: "6379"
      REDIS_QUEUE_CONNECTION: queue
      REDIS_QUEUE_DB: "14"
      REDIS_PREFIX: "agatceramic-queue-test:"
      REDIS_QUEUE_BLOCK_FOR: "1"
      SESSION_DRIVER: array
      STORAGE_CLEANUP_JOB_BACKOFF: "1,1"
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    depends_on:
      queue-test-postgres:
        condition: service_healthy
      queue-test-redis:
        condition: service_healthy

  queue-test-postgres:
    image: postgres:17.9-alpine
    profiles: ["queue-integration"]
    environment:
      POSTGRES_DB: agatceramic_queue_test
      POSTGRES_USER: agatceramic_queue_test
      POSTGRES_PASSWORD: queue-test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agatceramic_queue_test -d agatceramic_queue_test"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  queue-test-redis:
    image: redis:7.4-alpine
    profiles: ["queue-integration"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  admin-smoke-backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    profiles: ["admin-smoke"]
    working_dir: /var/www/backend
    command: >-
      sh -c "install-locked-dependencies composer /var/www/backend
      && php scripts/assert-safe-postgres-test-environment.php agatceramic_admin_smoke_test
      && php artisan migrate:fresh --seed --force
      && php scripts/setup-admin-full-stack-smoke.php
      && exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      APP_URL: http://admin-smoke:4173
      ADMIN_APP_URL: http://admin-smoke:4173
      ADMIN_SMOKE_STATE_FILE: /smoke-state/fixtures.json
      BCRYPT_ROUNDS: "4"
      CI: "true"
      DB_CONNECTION: pgsql
      DB_HOST: admin-smoke-postgres
      DB_PORT: "5432"
      DB_DATABASE: agatceramic_admin_smoke_test
      DB_USERNAME: agatceramic_admin_smoke_test
      DB_PASSWORD: admin-smoke-test-only-password
      DB_SSLMODE: prefer
      DB_URL: ""
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: admin-smoke-redis
      REDIS_PORT: "6379"
      REDIS_DB: "13"
      REDIS_CACHE_DB: "12"
      SESSION_DRIVER: redis
      SESSION_COOKIE: agatceramic_admin_smoke_session
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: admin-smoke:4173
      CORS_ALLOWED_ORIGINS: http://admin-smoke:4173
      MAIL_MAILER: array
    volumes:
      - ./backend:/var/www/backend
      - admin_smoke_backend_vendor:/var/www/backend/vendor
      - admin_smoke_state:/smoke-state
    depends_on:
      admin-smoke-postgres:
        condition: service_healthy
      admin-smoke-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/up\") === false ? 1 : 0);'",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  admin-smoke:
    build:
      context: .
      dockerfile: infrastructure/docker/node/Dockerfile
    profiles: ["admin-smoke"]
    working_dir: /app
    command: >-
      sh -c "install-locked-dependencies npm /app
      && npm run build
      && exec npm run preview -- --host 0.0.0.0 --port=4173"
    environment:
      ADMIN_PREVIEW_BACKEND_URL: http://admin-smoke-backend:8000
      VITE_API_BASE_URL: /api/v1
    volumes:
      - ./frontend/admin:/app
      - admin_smoke_node_modules:/app/node_modules
    depends_on:
      admin-smoke-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  admin-smoke-e2e:
    build:
      context: .
      dockerfile: infrastructure/docker/node/Dockerfile
    profiles: ["admin-smoke"]
    working_dir: /app
    command: >-
      sh -c "install-locked-dependencies npm /app
      && npm exec playwright install chromium
      && exec npm run test:smoke"
    environment:
      ADMIN_SMOKE_BASE_URL: http://admin-smoke:4173
      ADMIN_SMOKE_STATE_FILE: /smoke-state/fixtures.json
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./frontend/admin:/app
      - admin_smoke_node_modules:/app/node_modules
      - admin_smoke_playwright_browsers:/ms-playwright
      - admin_smoke_state:/smoke-state:ro
    depends_on:
      admin-smoke-backend:
        condition: service_healthy
      admin-smoke:
        condition: service_healthy

  admin-smoke-postgres:
    image: postgres:17.9-alpine
    profiles: ["admin-smoke"]
    environment:
      POSTGRES_DB: agatceramic_admin_smoke_test
      POSTGRES_USER: agatceramic_admin_smoke_test
      POSTGRES_PASSWORD: admin-smoke-test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agatceramic_admin_smoke_test -d agatceramic_admin_smoke_test",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  admin-smoke-redis:
    image: redis:7.4-alpine
    profiles: ["admin-smoke"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    working_dir: /var/www/backend
    command: >-
      sh -c "install-locked-dependencies composer /var/www/backend
      && exec php artisan schedule:work"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/node/Dockerfile
    working_dir: /app
    command: >-
      sh -c "install-locked-dependencies npm /app
      && exec npm run dev -- --host 0.0.0.0 --port=5173"
    volumes:
      - ./frontend/admin:/app
      - admin_node_modules:/app/node_modules
    ports:
      - "${ADMIN_PORT:-5173}:5173"

  admin-e2e:
    build:
      context: .
      dockerfile: infrastructure/docker/node/Dockerfile
    profiles: ["test"]
    working_dir: /app
    command: >-
      sh -c "npm ci
      && npm exec playwright install chromium
      && npm run test:e2e"
    environment:
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./frontend/admin:/app
      - admin_e2e_node_modules:/app/node_modules
      - admin_playwright_browsers:/ms-playwright

  client:
    build:
      context: .
      dockerfile: infrastructure/docker/node/Dockerfile
    working_dir: /app
    command: >-
      sh -c "install-locked-dependencies npm /app
      && exec npm run dev -- --host 0.0.0.0 --port=3000"
    volumes:
      - ./frontend/client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "${CLIENT_PORT:-3000}:3000"

  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_vendor:
  admin_smoke_backend_vendor:
  admin_smoke_node_modules:
  admin_smoke_playwright_browsers:
  admin_smoke_state:
  admin_node_modules:
  admin_e2e_node_modules:
  admin_playwright_browsers:
  client_node_modules:
  postgres_data:
  redis_data:
