name: agatceramic

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    working_dir: /var/www/backend
    command: >-
      sh -c "install-locked-dependencies composer /var/www/backend
      && exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./backend:/var/www/backend
      - ./docs:/var/www/docs:ro
      - backend_vendor:/var/www/backend/vendor
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    working_dir: /var/www/backend
    command: >-
      sh -c "install-locked-dependencies composer /var/www/backend
      && exec php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue-integration:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    profiles: ["queue-integration"]
    working_dir: /var/www/backend
    command: >-
      sh -c "install-locked-dependencies composer /var/www/backend
      && exec sh scripts/run-redis-queue-integration.sh"
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      CI: "true"
      DB_CONNECTION: pgsql
      DB_HOST: queue-test-postgres
      DB_PORT: "5432"
      DB_DATABASE: agatceramic_queue_test
      DB_USERNAME: agatceramic_queue_test
      DB_PASSWORD: queue-test-only-password
      DB_SSLMODE: prefer
      DB_URL: ""
      CACHE_STORE: array
      MAIL_MAILER: array
      MAIL_FROM_ADDRESS: queue-worker@example.test
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: queue-test-redis
      REDIS_PORT: "6379"
      REDIS_QUEUE_CONNECTION: queue
      REDIS_QUEUE_DB: "14"
      REDIS_PREFIX: "agatceramic-queue-test:"
      REDIS_QUEUE_BLOCK_FOR: "1"
      SESSION_DRIVER: array
      STORAGE_CLEANUP_JOB_BACKOFF: "1,1"
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    depends_on:
      queue-test-postgres:
        condition: service_healthy
      queue-test-redis:
        condition: service_healthy

  queue-test-postgres:
    image: postgres:17.9-alpine
    profiles: ["queue-integration"]
    environment:
      POSTGRES_DB: agatceramic_queue_test
      POSTGRES_USER: agatceramic_queue_test
      POSTGRES_PASSWORD: queue-test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agatceramic_queue_test -d agatceramic_queue_test"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  queue-test-redis:
    image: redis:7.4-alpine
    profiles: ["queue-integration"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    working_dir: /var/www/backend
    command: >-
      sh -c "install-locked-dependencies composer /var/www/backend
      && exec php artisan schedule:work"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/node/Dockerfile
    working_dir: /app
    command: >-
      sh -c "install-locked-dependencies npm /app
      && exec npm run dev -- --host 0.0.0.0 --port=5173"
    volumes:
      - ./frontend/admin:/app
      - admin_node_modules:/app/node_modules
    ports:
      - "${ADMIN_PORT:-5173}:5173"

  admin-e2e:
    build:
      context: .
      dockerfile: infrastructure/docker/node/Dockerfile
    profiles: ["test"]
    working_dir: /app
    command: >-
      sh -c "npm ci
      && npm exec playwright install chromium
      && npm run test:e2e"
    environment:
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./frontend/admin:/app
      - admin_e2e_node_modules:/app/node_modules
      - admin_playwright_browsers:/ms-playwright

  client:
    build:
      context: .
      dockerfile: infrastructure/docker/node/Dockerfile
    working_dir: /app
    command: >-
      sh -c "install-locked-dependencies npm /app
      && exec npm run dev -- --host 0.0.0.0 --port=3000"
    volumes:
      - ./frontend/client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "${CLIENT_PORT:-3000}:3000"

  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_vendor:
  admin_node_modules:
  admin_e2e_node_modules:
  admin_playwright_browsers:
  client_node_modules:
  postgres_data:
  redis_data:
