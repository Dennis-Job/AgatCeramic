name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Repository security
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject database artifacts in Git refs
        run: bash scripts/assert-no-database-artifacts.sh

      - name: Install pinned Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          binary="$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          test -x "$binary"

      - name: Scan complete Git history for secrets
        run: >-
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100
          --log-opts="--all" --timeout=300 .

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_DB: agatceramic_test
          POSTGRES_USER: agatceramic
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agatceramic -d agatceramic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Ensure Laravel writable directories exist
        run: mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create test application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Guard against incompatible OpenAPI drift
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:docs/openapi.json"; then
            git show "$BASE_SHA:docs/openapi.json" > "$RUNNER_TEMP/openapi-base.json"
            php backend/scripts/assert-openapi-compatible.php "$RUNNER_TEMP/openapi-base.json" docs/openapi.json
          fi

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run Laravel static analysis
        run: composer analyse

      - name: Verify PostgreSQL migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: agatceramic_test
          DB_USERNAME: agatceramic
          DB_PASSWORD: ci-only-password
          DB_SSLMODE: prefer
        run: php artisan migrate:fresh --force

      - name: Test PostgreSQL audit-log immutability
        env:
          CI: "true"
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: agatceramic_test
          DB_USERNAME: agatceramic
          DB_PASSWORD: ci-only-password
          DB_SSLMODE: prefer
        run: vendor/bin/phpunit --configuration=phpunit.postgres.xml tests/Integration/PostgresAuditLogImmutabilityTest.php

      - name: Test PostgreSQL Catalog concurrency invariants
        env:
          CI: "true"
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: agatceramic_test
          DB_USERNAME: agatceramic
          DB_PASSWORD: ci-only-password
          DB_SSLMODE: prefer
        run: vendor/bin/phpunit --configuration=phpunit.postgres.xml tests/Integration/PostgresCatalogConcurrencyTest.php

      - name: Test PostgreSQL retention controls
        env:
          CI: "true"
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: agatceramic_test
          DB_USERNAME: agatceramic
          DB_PASSWORD: ci-only-password
          DB_SSLMODE: prefer
        run: vendor/bin/phpunit --configuration=phpunit.postgres.xml tests/Integration/PostgresRetentionControlsTest.php

      - name: Test PostgreSQL guest cart lifecycle concurrency
        env:
          CI: "true"
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: agatceramic_test
          DB_USERNAME: agatceramic
          DB_PASSWORD: ci-only-password
          DB_SSLMODE: prefer
        run: vendor/bin/phpunit --configuration=phpunit.postgres.xml tests/Integration/PostgresGuestCartLifecycleTest.php

      - name: Verify Redis cache connection
        env:
          CACHE_STORE: redis
          QUEUE_CONNECTION: redis
          REDIS_CLIENT: phpredis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: >-
          php artisan tinker --execute="cache()->put('ci:redis:healthcheck', 'ok', 60);
          throw_unless(cache()->get('ci:redis:healthcheck') === 'ok');
          throw_unless(config('queue.default') === 'redis');
          throw_unless(app('queue')->connection()->size() >= 0);"

      - name: Run tests twice
        run: |
          composer test
          composer test

  admin:
    name: Admin checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint Admin source
        run: npm run lint

      - name: Check Admin formatting
        run: npm run format:check

      - name: Run Admin unit tests
        run: npm run test:unit

      - name: Build Admin SPA
        run: npm run build

      - name: Run Admin end-to-end tests
        working-directory: .
        run: docker compose --env-file .env.example --profile test run --rm admin-e2e

  client:
    name: Client checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check TypeScript
        run: npm exec nuxi typecheck

      - name: Build Nuxt client
        run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
